[project]
site_name = "clientwright"
site_description = "HTTP client platform: one resilience and observability core with adapters for httpx, aiohttp, requests, urllib3 and friends"
site_author = "Alex Shalaev"
site_url = "https://bedrock-python.github.io/clientwright/"
repo_name = "bedrock-python/clientwright"
repo_url = "https://github.com/bedrock-python/clientwright"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; 2026 Alex Shalaev"
docs_dir = "docs"
site_dir = "site"

nav = [
    { "Home" = "index.md" },
    { "Learn" = [
        { "Why clientwright" = "learn/why.md" },
        { "Installation" = "learn/install.md" },
        { "Your first client" = "learn/first-client.md" },
        { "Sync and async" = "learn/sync-and-async.md" },
    ] },
    { "Guide" = [
        { "Configuration" = "guide/configuration.md" },
        { "Timeouts and deadlines" = "guide/timeouts.md" },
        { "Retries" = "guide/retries.md" },
        { "Circuit breaker" = "guide/circuit-breaker.md" },
        { "Redirects" = "guide/redirects.md" },
        { "Per-call options" = "guide/per-call-options.md" },
        { "Observability" = "guide/observability.md" },
        { "Masking PII" = "guide/masking.md" },
        { "Proxies and TLS" = "guide/proxies-tls.md" },
        { "Native passthrough" = "guide/native-options.md" },
        { "Capability honesty" = "guide/capabilities.md" },
        { "Dependency injection" = "guide/dishka.md" },
        { "Deadline budgets" = "guide/deadline-budget.md" },
        { "Testing your service" = "guide/testing.md" },
    ] },
    { "Adapters" = [
        { "Choosing an adapter" = "adapters/index.md" },
        { "httpx" = "adapters/httpx.md" },
        { "httpx2" = "adapters/httpx2.md" },
        { "aiohttp" = "adapters/aiohttp.md" },
        { "requests" = "adapters/requests.md" },
        { "urllib3" = "adapters/urllib3.md" },
    ] },
    { "Advanced" = [
        { "Architecture" = "advanced/architecture.md" },
        { "Writing an adapter" = "advanced/writing-an-adapter.md" },
        { "Migration" = "advanced/migration.md" },
    ] },
    { "API Reference" = [
        { "Overview" = "reference/index.md" },
        { "Core" = "reference/core.md" },
        { "Adapters" = "reference/adapters.md" },
        { "Contrib" = "reference/contrib.md" },
        { "Testing" = "reference/testing.md" },
    ] },
    { "Changelog" = "changelog.md" },
]

[project.theme]
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
    "toc.integrate",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 3
